<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityFix — Manage accounts</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { text-align: center; }
        .message { background: #f0fdf4; color: #166534; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .empty { background: #f0f9ff; padding: 16px; border-radius: 8px; text-align: center; margin-bottom: 16px; }
        .actions-bar { margin-bottom: 16px; }
        .actions-bar a { display: inline-block; padding: 10px 20px; background: #2563eb; color: white; border-radius: 4px; text-decoration: none; }
        .actions-bar a:hover { background: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e2e8f0; }
        th { color: #475569; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8125rem; color: white; }
        .badge-active { background: #15803d; }
        .badge-inactive { background: #b91c1c; }
        .row-action button { padding: 6px 12px; border: none; border-radius: 4px; color: white; cursor: pointer; font-size: 0.875rem; }
        .deactivate { background: #b91c1c; }
        .deactivate:hover { background: #991b1b; }
        .activate { background: #15803d; }
        .activate:hover { background: #166534; }
        .pager { display: flex; gap: 16px; align-items: center; justify-content: center; margin-top: 20px; color: #475569; font-size: 0.9375rem; }
        .link { text-align: center; margin-top: 24px; }
    </style>
</head>
<body>
    <h1>Manage accounts</h1>

    <div th:if="${accountMessage}" class="message" th:text="${accountMessage}"></div>

    <div class="actions-bar">
        <a th:href="@{/admin/users/new}">Create staff account</a>
    </div>

    <div th:if="${#lists.isEmpty(accounts)}" class="empty">
        <p>No staff or resident accounts yet.</p>
    </div>

    <table th:unless="${#lists.isEmpty(accounts)}">
        <thead>
            <tr>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Created</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <!-- Admin rows are excluded by the repository query, not here: the rule belongs
                 to the service layer so no future view can re-expose them. -->
            <tr th:each="account : ${accounts}">
                <td th:text="${account.email}">someone@example.com</td>
                <td th:text="${account.roleLabel}">Resident</td>
                <td>
                    <span th:class="${account.active} ? 'badge badge-active' : 'badge badge-inactive'"
                          th:text="${account.active} ? 'Active' : 'Deactivated'">Active</span>
                </td>
                <td th:text="${dateFormatter.format(account.createdAt)}">1 Jan 2026</td>
                <td class="row-action">
                    <form th:action="@{/admin/users/{id}/active(id=${account.id})}" method="post">
                        <input type="hidden" name="active" th:value="${!account.active}">
                        <button type="submit"
                                th:class="${account.active} ? 'deactivate' : 'activate'"
                                th:text="${account.active} ? 'Deactivate' : 'Activate'">Deactivate</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <nav class="pager" th:if="${page.totalPages > 1}">
        <a th:if="${!page.first}" th:href="@{/admin/users(page=${page.number - 1})}">&larr; Previous</a>
        <span th:text="|Page ${page.number + 1} of ${page.totalPages} — ${page.totalElements} account(s)|">Page 1 of 1</span>
        <a th:if="${!page.last}" th:href="@{/admin/users(page=${page.number + 1})}">Next &rarr;</a>
    </nav>

    <p class="link"><a th:href="@{/}">Home</a></p>
</body>
</html>
