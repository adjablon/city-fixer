<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityFix</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 80px auto; padding: 0 20px; }
        h1 { text-align: center; }
        .info { background: #f0f9ff; padding: 16px; border-radius: 8px; margin: 24px 0; }
        .actions { text-align: center; margin-top: 24px; }
        .actions button { padding: 10px 20px; background: #dc2626; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        .actions button:hover { background: #b91c1c; }
    </style>
</head>
<body>
    <h1>CityFix</h1>
    <div class="info">
        <p>Logged in as <strong sec:authentication="name">user</strong></p>
        <p><a th:href="@{/reports/new}">Report a problem</a> — place a pin on the map and describe what is wrong.</p>
        <p><a th:href="@{/reports}">My reports</a> — everything you have reported so far.</p>
    </div>
    <div class="actions">
        <form th:action="@{/logout}" method="post">
            <button type="submit">Log out</button>
        </form>
    </div>
</body>
</html>
