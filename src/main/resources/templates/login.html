<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityFix — Login</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 400px; margin: 80px auto; padding: 0 20px; }
        h1 { text-align: center; }
        form { display: flex; flex-direction: column; gap: 12px; }
        label { font-weight: 600; }
        input[type="email"], input[type="password"] {
            padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem;
        }
        button { padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .error { color: #dc2626; background: #fef2f2; padding: 8px 12px; border-radius: 4px; }
        .message { color: #16a34a; background: #f0fdf4; padding: 8px 12px; border-radius: 4px; }
        .link { text-align: center; margin-top: 16px; }
    </style>
</head>
<body>
    <h1>CityFix</h1>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${message}" class="message" th:text="${message}"></div>
    <form th:action="@{/login}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Log in</button>
    </form>
    <p class="link">Don't have an account? <a th:href="@{/register}">Register</a></p>
</body>
</html>
