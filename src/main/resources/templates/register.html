<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityFix — Register</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 400px; margin: 80px auto; padding: 0 20px; }
        h1 { text-align: center; }
        form { display: flex; flex-direction: column; gap: 12px; }
        label { font-weight: 600; }
        input[type="email"], input[type="password"] {
            padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem;
        }
        button { padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .error { color: #dc2626; background: #fef2f2; padding: 8px 12px; border-radius: 4px; }
        .link { text-align: center; margin-top: 16px; }
    </style>
</head>
<body>
    <h1>CityFix — Register</h1>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <form th:action="@{/register}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" th:value="${email}" required autofocus>
        <label for="password">Password (min 8 characters)</label>
        <input type="password" id="password" name="password" required minlength="8">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8">
        <button type="submit">Register</button>
    </form>
    <p class="link">Already have an account? <a th:href="@{/login}">Log in</a></p>
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            var pw = document.getElementById('password').value;
            var cpw = document.getElementById('confirmPassword').value;
            if (pw !== cpw) { e.preventDefault(); alert('Passwords do not match.'); }
        });
    </script>
</body>
</html>
