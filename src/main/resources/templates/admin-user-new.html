<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityFix — Create staff account</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; }
        h1 { text-align: center; }
        .hint { color: #475569; font-size: 0.9375rem; text-align: center; margin-bottom: 24px; }
        .error { background: #fef2f2; color: #b91c1c; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 10px; margin-bottom: 4px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
        .field-error { color: #b91c1c; font-size: 0.875rem; margin: 0 0 12px; }
        button { width: 100%; padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .link { text-align: center; margin-top: 24px; }
    </style>
</head>
<body>
    <h1>Create staff account</h1>
    <p class="hint">The new account can triage reports immediately. Share the password directly — CityFix sends no email.</p>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/admin/users}" th:object="${createStaffForm}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" th:value="*{email}" required>
        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" required>
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <button type="submit">Create account</button>
    </form>

    <p class="link"><a th:href="@{/admin/users}">Back to accounts</a></p>
</body>
</html>
