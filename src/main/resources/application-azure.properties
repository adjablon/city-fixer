# Database — values injected via App Service env vars
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File upload — container-level DoS bounds only; PhotoValidator enforces the 2 MB
# product limit (see application.properties).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Map default centre (Warsaw)
cityfix.map.default-lat=52.2297
cityfix.map.default-lng=21.0122
cityfix.map.default-zoom=13

# Staff seed (env-var driven; set as App Service application settings)
staff.seed.email=${STAFF_EMAIL:}
staff.seed.password=${STAFF_PASSWORD:}

# Azure App Service expects port 80
server.port=80
