spring.application.name=city-fix

# Database (local dev — Docker Compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/cityfix
spring.datasource.username=cityfix
spring.datasource.password=cityfix
spring.jpa.hibernate.ddl-auto=update

# File upload — container-level DoS bounds only, deliberately well above the 2 MB
# product limit. PhotoValidator owns that limit: a part Tomcat rejects for size loses
# its _csrf parameter, so Spring Security answers 403 before any controller runs.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Map default centre (Warsaw)
cityfix.map.default-lat=52.2297
cityfix.map.default-lng=21.0122
cityfix.map.default-zoom=13

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Admin seed (env-var driven)
admin.seed.email=${ADMIN_EMAIL:}
admin.seed.password=${ADMIN_PASSWORD:}

# Staff seed (env-var driven) — bootstrap until S-03 adds admin-managed staff accounts
staff.seed.email=${STAFF_EMAIL:}
staff.seed.password=${STAFF_PASSWORD:}
